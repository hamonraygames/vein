<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
		<title>$GODOT_PROJECT_NAME</title>
		<!--
			Telegram Mini App support. Loading this script is harmless outside
			Telegram (window.Telegram.WebApp still exists as a no-op-safe stub per
			Telegram's own docs), so the same export serves both the plain web
			build and the Mini App without a fork.
		-->
		<script src="https://telegram.org/js/telegram-web-app.js"></script>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* Real native text input for the one-time name prompt (see
   scripts/name_prompt.gd) — a canvas has no DOM element for a mobile
   browser to focus, so Godot's own canvas-drawn LineEdit can never reliably
   raise the on-screen keyboard on a phone (a known, unfixed Godot web-export
   limitation, not something fixable from GDScript alone). This is a real
   <input>, positioned over the canvas by JS to match name_prompt.gd's own
   layout fractions, so a tap on it is a genuine native focus event with a
   real OS keyboard behind it — Godot only ever reads its final value. */
#vein-name-input {
	position: absolute;
	display: none;
	box-sizing: border-box;
	background: #17171c;
	color: #ede8dc;
	border: 2px solid #9c9184;
	border-radius: 6px;
	text-align: center;
	font-family: -apple-system, 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	outline: none;
	touch-action: manipulation;
	z-index: 10000;
}

#vein-name-input::placeholder {
	color: #6a6a6a;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<input id="vein-name-input" type="text" maxlength="20" autocomplete="off"
			autocapitalize="words" autocorrect="off" spellcheck="false">

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
// Runs before the engine script so the Telegram chrome (top bar, swipe-to-
// close) is out of the way before the WASM payload even starts loading.
// Safe to run unconditionally: outside Telegram, window.Telegram.WebApp is
// simply undefined and every call below is guarded.
(function () {
	const tg = window.Telegram && window.Telegram.WebApp;
	if (!tg) {
		return;
	}
	tg.ready();
	tg.expand();
	// VEIN's one drag verb (drawing/cutting a vein) reads to Telegram's
	// WebView as a vertical swipe and would otherwise close the Mini App
	// mid-gesture. This is the whole reason a Mini App needs shell changes
	// at all, not just a hosted URL.
	if (tg.disableVerticalSwipes) {
		tg.disableVerticalSwipes();
	}
	if (tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && tg.requestFullscreen) {
		tg.requestFullscreen();
	}
	// Match VEIN's own background (Palette.BG, #0d0d10) so the Telegram
	// chrome around the canvas never flashes white or a mismatched theme
	// colour during load.
	if (tg.setBackgroundColor) {
		tg.setBackgroundColor('#0d0d10');
	}
	if (tg.setHeaderColor) {
		tg.setHeaderColor('#0d0d10');
	}
	// Telegram resizes its WebView viewport (keyboard, safe area, fullscreen
	// toggle) without firing a native browser `resize` event, which is the
	// only signal Godot's own canvas layout listens for. Without this, the
	// canvas can be left the wrong size after any Telegram-driven resize.
	tg.onEvent('viewportChanged', function () {
		window.dispatchEvent(new Event('resize'));
	});

	// Silent on Telegram's MOBILE app (iOS/Android's native in-app WebView),
	// fine on Telegram Desktop's own webview and on a plain browser tab.
	// VEIN starts its background track the instant the scene is ready (see
	// game.gd's start_run(), called from _ready(), which calls Audio.start())
	// — before the player has touched anything. A strict mobile WebView's Web
	// Audio autoplay policy is born-suspended until the PAGE has "user
	// activation" from a real gesture, and normally Godot's own web runtime
	// grabs that from the page's first click/touch/key automatically — but
	// this game's one interaction verb is a DRAG (see VEIN.md), and
	// disableVerticalSwipes() above already proves Telegram's native gesture
	// recognizer intercepts that drag's early touch events on mobile before
	// they behave like an ordinary page click, which is exactly the kind of
	// thing that can make a WebView never count it as the trusted gesture
	// autoplay-unlock is watching for. Priming (creating AND actually
	// playing a silent buffer through) an AudioContext of our own on the
	// EARLIEST raw touch/pointer/key event — capture phase, before Telegram
	// or Godot can intercept or reinterpret it — grants the page that
	// activation directly; per the Web Audio autoplay spec, any AudioContext
	// created afterward (including Godot's own, already-suspended one)
	// starts/resumes unsuspended too. Scoped to inside the Telegram guard
	// only — the plain web build already works today and this must not
	// change its audio init path.
	var _audioPrimed = false;
	function _primeAudio() {
		if (_audioPrimed) {
			return;
		}
		_audioPrimed = true;
		var Ctx = window.AudioContext || window.webkitAudioContext;
		if (!Ctx) {
			return;
		}
		var ctx = new Ctx();
		if (ctx.state === 'suspended') {
			ctx.resume();
		}
		var buffer = ctx.createBuffer(1, 1, 22050);
		var src = ctx.createBufferSource();
		src.buffer = buffer;
		src.connect(ctx.destination);
		src.start(0);
	}
	['touchstart', 'touchend', 'pointerdown', 'mousedown', 'keydown'].forEach(function (evt) {
		document.addEventListener(evt, _primeAudio, { capture: true, passive: true });
	});
}());
		</script>
		<script>
// Real native <input> bridge for the one-time name prompt (see
// scripts/name_prompt.gd — and the #vein-name-input CSS comment above for
// WHY this exists instead of Godot's own web LineEdit). Unconditional, not
// inside the Telegram guard above: the underlying problem — a canvas has no
// DOM element for a mobile browser to focus, so Godot's web LineEdit can
// never reliably raise the on-screen keyboard on a phone — is a plain
// mobile-web limitation, not a Telegram-specific one.
//
// Fractions (0..1) are relative to the CANVAS's own on-screen CSS rect, the
// same design-space fractions name_prompt.gd already lays its own Controls
// out with, so the two stay visually aligned regardless of window size or
// the project's stretch/letterbox mode.
(function () {
	var input = document.getElementById('vein-name-input');
	var lastFracs = null;
	// project.godot: window/stretch/mode="canvas_items", aspect="keep" — the
	// <canvas> ELEMENT fills the whole browser viewport, but Godot only
	// draws the actual 540x1170 design-space game into a scaled, CENTERED
	// sub-rect of it (the rest is letterbox bars Godot paints itself, not
	// empty canvas). Verified against a real build on a landscape desktop
	// window: using the canvas's own getBoundingClientRect() directly, as a
	// first pass here did, put the input off to one side by exactly the
	// letterbox gap — harder to notice on a portrait phone close to this
	// aspect ratio, but still wrong, and not something to leave wrong just
	// because it happens to look close enough on one shape of screen.
	var DESIGN_W = 540;
	var DESIGN_H = 1170;

	function gameRect() {
		var canvas = document.getElementById('canvas');
		var r = canvas.getBoundingClientRect();
		var scale = Math.min(r.width / DESIGN_W, r.height / DESIGN_H);
		var w = DESIGN_W * scale;
		var h = DESIGN_H * scale;
		return {
			left: r.left + (r.width - w) / 2,
			top: r.top + (r.height - h) / 2,
			width: w,
			height: h,
		};
	}

	// Verified against a real build: the canvas is NOT guaranteed to have a
	// real on-screen size at the exact moment GDScript's _ready() calls
	// this — Godot's own runtime finishes sizing it slightly later on some
	// load paths — and reading getBoundingClientRect() once, immediately,
	// produced a genuine (0, 0) rect that made the input effectively
	// invisible with no error anywhere. Retrying across animation frames
	// until the canvas actually has a size fixes that instead of trusting
	// the first read.
	function positionInput() {
		if (!lastFracs) {
			return false;
		}
		var rect = gameRect();
		if (rect.width === 0 || rect.height === 0) {
			return false;
		}
		input.style.left = (rect.left + rect.width * lastFracs.x) + 'px';
		input.style.top = (rect.top + rect.height * lastFracs.y) + 'px';
		input.style.width = (rect.width * lastFracs.w) + 'px';
		input.style.height = (rect.height * lastFracs.h) + 'px';
		input.style.fontSize = Math.max(14, rect.height * lastFracs.h * 0.42) + 'px';
		return true;
	}

	function positionWithRetry(attempts) {
		if (positionInput() || attempts <= 0) {
			return;
		}
		requestAnimationFrame(function () { positionWithRetry(attempts - 1); });
	}

	window.veinShowNameInput = function (xFrac, yFrac, wFrac, hFrac, placeholder) {
		lastFracs = { x: xFrac, y: yFrac, w: wFrac, h: hFrac };
		input.placeholder = placeholder || '';
		input.value = '';
		input.style.display = 'block';
		positionWithRetry(90);
	};

	window.veinHideNameInput = function () {
		lastFracs = null;
		input.style.display = 'none';
		input.blur();
	};

	window.veinGetNameInputValue = function () {
		return input.value;
	};

	// The canvas can also resize AFTER the input is already showing
	// (window resize, orientation change, Telegram's own viewportChanged
	// dispatch above) — same reason the canvas itself listens for
	// 'resize'; this keeps the overlay aligned with it.
	window.addEventListener('resize', positionInput);

	// Enter/"Go" on the mobile keyboard submits directly, same as tapping
	// the in-game Continue button — worth having on top of that button, not
	// just a nicety: an open mobile keyboard can be tall enough to cover
	// the button entirely on a short screen. Blur first so the keyboard
	// dismisses as part of the same action, then hand off; name_prompt.gd
	// sets veinOnNameSubmit to a real callback via
	// JavaScriptBridge.create_callback, so GDScript — not this shell — owns
	// what "submit" actually does (saving the name, starting the run).
	window.veinOnNameSubmit = null;
	input.addEventListener('keydown', function (e) {
		if (e.key === 'Enter') {
			e.preventDefault();
			input.blur();
			if (window.veinOnNameSubmit) {
				window.veinOnNameSubmit(input.value);
			}
		}
	});
}());
		</script>
		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
