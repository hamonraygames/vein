<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
		<title>$GODOT_PROJECT_NAME</title>
		<!--
			Telegram Mini App support. Loading this script is harmless outside
			Telegram (window.Telegram.WebApp still exists as a no-op-safe stub per
			Telegram's own docs), so the same export serves both the plain web
			build and the Mini App without a fork.
		-->
		<script src="https://telegram.org/js/telegram-web-app.js"></script>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
// Caps the render resolution. This is the single biggest cost in the whole
// build on a phone, and it is invisible from inside the game — it is decided
// here, before Godot ever boots.
//
// The Web preset exports with html/canvas_resize_policy=2 ("Adaptive"), and
// Godot's default display/window/dpi/allow_hidpi is TRUE, so the engine sizes
// its framebuffer at window.innerWidth/Height * window.devicePixelRatio (see
// godot_js_display_pixel_ratio_get). On a current phone DPR is 3, so a
// 390x844 CSS viewport became a 1170x2532 framebuffer — NINE times the pixels
// — and MSAA then multiplies samples on top of that. Every fragment of every
// vein, node, dot and glow is paid for at that resolution, every frame, for
// the entire run. That is the "phone gets hot and slow" report: it is fill
// rate and memory bandwidth, not game logic, and no amount of script-level
// optimisation touches it (the earlier pass audited every _process/_draw and
// found nothing comparable, because the cost was never in the scripts).
//
// Clamping to 2 rather than turning HiDPI off entirely, deliberately: the
// design canvas is 540x1170 (see project.godot) and stretch/mode is
// canvas_items, so the board is rendered into whatever framebuffer this
// yields. At DPR 1 that framebuffer is SMALLER than the design canvas (390 <
// 540) — the game would render below its own authored resolution and get
// upscaled, which is visibly soft and would break VEIN.md's "screenshots
// should be beautiful enough to be the marketing." At DPR 2 it is 780x1688,
// still a 1.44x supersample of the design canvas, so the vector edges stay
// crisp while costing 2.25x less than DPR 3. The step from 2x to 3x is
// close to imperceptible at phone viewing distance; the cost is not.
//
// A getter (not a one-time assignment) because Godot re-reads this on every
// resize, and Telegram's WebView fires those often (see viewportChanged
// below).
(function () {
	const MAX_DPR = 2;
	if ((window.devicePixelRatio || 1) <= MAX_DPR) {
		return;
	}
	Object.defineProperty(window, 'devicePixelRatio', {
		configurable: true,
		get: function () {
			return MAX_DPR;
		},
	});
}());
		</script>
		<script>
// Runs before the engine script so the Telegram chrome (top bar, swipe-to-
// close) is out of the way before the WASM payload even starts loading.
// Safe to run unconditionally: outside Telegram, window.Telegram.WebApp is
// simply undefined and every call below is guarded.
(function () {
	// VEIN starts its background track the instant the scene is ready (see
	// game.gd's start_run(), called from _ready(), which calls Audio.start())
	// — before the player has touched anything. Web Audio autoplay policy is
	// born-suspended until the PAGE has "user activation" from a real
	// gesture, and normally a browser's own audio-unlock logic grabs that
	// from the page's first click/touch/key automatically — but this game's
	// one interaction verb is a DRAG (see VEIN.md), not a tap/click, and on
	// mobile Safari/Chrome that reliably failed to register as the trusted
	// gesture autoplay-unlock was waiting for, same failure mode as
	// Telegram's WebView below. Priming (creating AND actually playing a
	// silent buffer through) an AudioContext of our own on the EARLIEST raw
	// touch/pointer/key event — capture phase, before anything else can
	// intercept or reinterpret it — grants the page that activation
	// directly; per the Web Audio autoplay spec, any AudioContext created
	// afterward (including Godot's own, already-suspended one)
	// starts/resumes unsuspended too.
	//
	// Originally scoped to only run inside Telegram's guard below, on the
	// assumption a plain mobile browser tab already got this for free — that
	// assumption did not hold on real devices (reported: no sound on mobile
	// in either a plain browser tab or the Telegram Mini App), so this now
	// runs unconditionally, Telegram or not. Harmless where it was never
	// needed: priming an extra silent AudioContext has no audible or visible
	// effect on a desktop tab where autoplay was never blocked to begin with.
	var _audioPrimed = false;
	function _primeAudio() {
		if (_audioPrimed) {
			return;
		}
		_audioPrimed = true;
		var Ctx = window.AudioContext || window.webkitAudioContext;
		if (!Ctx) {
			return;
		}
		var ctx = new Ctx();
		if (ctx.state === 'suspended') {
			ctx.resume();
		}
		var buffer = ctx.createBuffer(1, 1, 22050);
		var src = ctx.createBufferSource();
		src.buffer = buffer;
		src.connect(ctx.destination);
		src.start(0);
	}
	['touchstart', 'touchend', 'pointerdown', 'mousedown', 'keydown'].forEach(function (evt) {
		document.addEventListener(evt, _primeAudio, { capture: true, passive: true });
	});

	const tg = window.Telegram && window.Telegram.WebApp;
	if (!tg) {
		return;
	}
	tg.ready();
	tg.expand();
	// VEIN's one drag verb (drawing/cutting a vein) reads to Telegram's
	// WebView as a vertical swipe and would otherwise close the Mini App
	// mid-gesture. This is the whole reason a Mini App needs shell changes
	// at all, not just a hosted URL.
	if (tg.disableVerticalSwipes) {
		tg.disableVerticalSwipes();
	}
	if (tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && tg.requestFullscreen) {
		tg.requestFullscreen();
	}
	// Match VEIN's own background (Palette.BG, #0d0d10) so the Telegram
	// chrome around the canvas never flashes white or a mismatched theme
	// colour during load.
	if (tg.setBackgroundColor) {
		tg.setBackgroundColor('#0d0d10');
	}
	if (tg.setHeaderColor) {
		tg.setHeaderColor('#0d0d10');
	}
	// Telegram resizes its WebView viewport (keyboard, safe area, fullscreen
	// toggle) without firing a native browser `resize` event, which is the
	// only signal Godot's own canvas layout listens for. Without this, the
	// canvas can be left the wrong size after any Telegram-driven resize.
	tg.onEvent('viewportChanged', function () {
		window.dispatchEvent(new Event('resize'));
	});
}());
		</script>
		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
